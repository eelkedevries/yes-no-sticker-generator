name: Direct GitHub link update

on:
  push:
    branches: [agent/direct-github-link]

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/direct-github-link
          fetch-depth: 0

      - name: Replace generic GitHub profile link
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<a class="iconlink" href="https://github.com/eelkedevries/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">'
          new = '<a class="iconlink" href="https://github.com/eelkedevries/my-review-policy" target="_blank" rel="noopener noreferrer" aria-label="GitHub">'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one generic GitHub icon link, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/direct-github-link.yml

      - name: Commit completed update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/direct-github-link.yml
          git commit -m "Link GitHub icon to project repository"
          git push origin HEAD:agent/direct-github-link
